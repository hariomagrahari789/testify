<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        *
        {
            box-sizing: border-box;
            margin: 0%;
            padding: 0%;
        }
        .subscribtion
        {
            display: block;
            position: relative;
            margin-left: 25%;
            margin-top: 10%;
            border: 2px solid gray;
            width:500px;
            height: 400px;
            background-color: whitesmoke;
            box-shadow: 5px 0px 10px 0px #c9d6c6;
            opacity: 0.6;
            margin-bottom: 0%;
            
        }

        .subscribtion .sub
        {
            position: absolute;
            width: 170px;
            height: 200px;
            border: 2px solid red;
            border-radius: 5px;
            
            top: 10%;
            left: 10%;
            
        }

        

       


    </style>
</head>
<body>
    <div class="subscribtion">
        <div class="sub" id="sub1">low</div>
        <div class="sub" id="sub2">medium</div>
        <div class="sub" id="sub3">high</div>
    </div>
</body>
</html>
