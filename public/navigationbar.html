<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        
        
        body{
            background-image: url("bg5.jpg");
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center;
            background-size: cover;
        }
        .navbar
        {
            background-color: rgba(0, 0, 0, 0.3);
            
            overflow: auto;
            border-radius: 10px;
            margin-bottom: 0%;
        }
        .items
        {
            text-align: center;
        }
        .items li,a
        {
            text-align: center;
            float: left;
            list-style-type: none;
            color: aliceblue;
            display: inline-block;
            padding-right: 20px;
            margin-top: 4px;

            
            text-decoration: none;

        }


        .items ol  :hover
        {
            color: rgb(164, 173, 153);
            
        }
        .items div{
            float: left;
        }
        
        .items ol
        {
            overflow: auto;
        }
        
        #logo
        {
            margin-left: 10px;
            float: left;
            padding: 3px;
            margin-top: 0px;

        }
        #logo img
        {
            margin-top: 0px;
            height: 60px;
            width: 60px;
            border-radius: 100%;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        
        <div id="logo">
            <a href="#link"><img src="logo1.png"></a>
        </div>
        <div class="items">
        <ol>
            <li><a href="#link">HOME</a> </li>
            <li><a href="#link">ABOUT</a> </li>
            <li><a href="#link">SYLLABUS</a> </li>

        </ol>
        </div>
    </nav>
    
   
</html>
